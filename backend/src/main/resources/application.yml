spring:
  application:
    name: trading-control-plane
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trader}
    username: ${SPRING_DATASOURCE_USERNAME:trader}
    password: ${SPRING_DATASOURCE_PASSWORD:trader}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

trading:
  risk:
    risk-per-trade-pct: 0.50
    max-position-pct: 10
    max-total-crypto-exposure-pct: 80
    max-daily-loss-pct: 2
    max-weekly-loss-pct: 5
    caution-drawdown-pct: 7.5
    reduce-only-drawdown-pct: 10
    max-drawdown-pct: 15
    max-reference-to-stop-pct: 12
    asset-whitelist: BTC,ETH,SOL
